name: Context contracts

on:
  pull_request:
  push:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimal-install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked base dependencies
        run: |
          python -m pip install uv==0.9.30
          uv sync --locked --no-default-groups
      - name: Exercise the SQLite core without optional dependencies
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path
          from virtual_context import VirtualContextEngine, load_config
          from virtual_context.storage.sqlite import SQLiteStore
          from virtual_context.types import Fact
          for module in ('torch', 'sentence_transformers', 'anthropic', 'openai', 'starlette', 'psycopg'):
              assert importlib.util.find_spec(module) is None, module
          with tempfile.TemporaryDirectory() as directory:
              store = SQLiteStore(Path(directory) / 'smoke.db')
              try:
                  store.store_facts([Fact(id='fact', conversation_id='owner', subject='Alice', what='Alice likes tea')])
                  assert store.query_facts(conversation_id='owner')[0].what == 'Alice likes tea'
              finally:
                  store.close()
          assert callable(VirtualContextEngine) and callable(load_config)
          PY
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked contract dependencies
        run: |
          python -m pip install uv==0.9.30
          uv sync --locked --extra dev --extra proxy --extra postgres --extra providers
          .venv/bin/python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Check context contracts
        run: .venv/bin/python scripts/check_contracts.py
